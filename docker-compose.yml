services:
  spark:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=master
    volumes:
      - ./data/delta:/data/delta
      - ./app:/app
    env_file:
      - .env

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    ports:
      - "8888:8888"
    volumes:
      - ./data/delta:/data/delta
      - ./notebooks:/home/jovyan/work
      - ./app:/home/jovyan/app
    env_file:
      - .env
    depends_on:
      - spark

  md-python:
    container_name: md-python
    entrypoint: ["tail", "-f", "/dev/null"]
    build: .
    env_file:
      - .env
    volumes:
      - ./app:/app
