mydata:
  target: dev
  outputs:

    dev:
      type: duckdb
      path: "dev.duckdb"
      extensions:
        - delta
        - httpfs
      settings:
        delta_enable_local_files: "true"

    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: mydata
      schema: default
      threads: 4
