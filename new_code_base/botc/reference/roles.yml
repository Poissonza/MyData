roles:
  - name: Acrobat
    alignment: Townsfolk
    set: Experimental Characters
    description: Each night, chose a player, if they are or become drunk or poisoned tonight you die.

  - name: Al-Hadikhia
    alignment: Demon
    set: Experimental Characters
    description: Each night, you may choose 3 players(All players learn who). Each silently chooses to live or die. but if all live, all die.

  - name: Alchemist
    alignment: Townsfolk
    set: Experimental Characters
    description: You have a Minion ability. When using this, the storyteller may prompt you to choose differently.

  - name: Alsaahir
    alignment: Townsfolk
    set: Experimental Characters
    description: Each day, if you publicly guess which players are Minions and which are Demons, good wins.

  - name: Amnesiac
    alignment: Townsfolk
    set: Experimental Characters
    description: You do not know what your ability is. Each day, privately guess what it is. You learn how accurate you are.

  - name: Artist
    alignment: Townsfolk
    set: Sects & Violets
    description: Once per game, during the day, privately ask the story any yes/no question.

  - name: Assassin
    alignment: Minion
    set: Bad Moon Rising
    description: Once per game, at night, choose a player. They die, even if for some reason they could not.

  - name: Atheist
    alignment: Townsfolk
    set: Experimental Characters
    description: The Storyteller can break the game rules, and if executed, good wins even if you are dead.

  - name: Balloonist
    alignment: Townsfolk
    set: Experimental Characters
    description: Each night, you learn a player of a different character type than last night (May add 0 or 1 Outsiders).

  - name: Banshee
    alignment: Townsfolk
    set: Experimental Characters
    description: If the Demon kills you, all players learn this. From now on, you may nominate twice per day and vote twice per nomination.

  - name: Barber
    alignment: Outsider
    set: Sects & Violets
    description: If you died today or tonight, the demon may choose 2 players(Not another Demon) to swap characters.

  - name: Baron
    alignment: Minion
    set: Trouble Brewing
    description: They add 2 Outisiders to the game.

  - name: Boffin
    alignment: Minion
    set: Experimental Characters
    description: The Demon (even if drunk or poisoned) has a not-in-play good characters ability. You both know which.

  - name: Boomdandy
    alignment: Minion
    set: Experimental Characters
    description: If you are executed, all but 3 players die. After a 10 to 1 countdown, the player with the most players pointing at them, dies.

  - name: Bounty Hunter
    alignment: Townsfolk
    set: Experimental Characters
    description: You start knowing 1 evil player. If the player you know dies, you learn another evil player tonight(1 Townsfolk is Evil).

  - name: Butler
    alignment: Outsider
    set: Trouble Brewing
    description: Each night, pick a player. Tomorrow, you may only vote if they do.

  - name: Cannibal
    alignment: Townsfolk
    set: Experimental Characters
    description: Gains the ability of the person that was most recently executed if they where good.

  - name: Cerenovus
    alignment: Minion
    set: Sects & Violets
    description: Each night pick a player and force them to pretend to be another character

  - name: Chambermaid
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, Choose 2 alive players (Not yourself). You learn how many work tonight due to their ability.

  - name: Chef
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing how many pairs of evil players sit adjacent to each other.

  - name: Choirboy
    alignment: Townsfolk
    set: Experimental Characters
    description: If the Demon kills the king, you learn which player is the Demon (+ the King).

  - name: Clockmaker
    alignment: Townsfolk
    set: Sects & Violets
    description: You start knowing how many steps from the Demon to its nearest Minion.

  - name: Cortier
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Once per game, at night, choose a character. They are drunk for 3 nights & 3 days.

  - name: Cult Leader
    alignment: Townsfolk
    set: Experimental Characters
    description: Each night, you vecome the alignment of an alive neighbor. If all good players choose to join your cult, your team wins.

  - name: Damsel
    alignment: Outsider
    set: Experimental Characters
    description: All Minions know a Damsel is in play. If a Minion publicly guesses you (once), your team loses.

  - name: Devil's Advocate
    alignment: Minion
    set: Bad Moon Rising
    description: Each night, choose a living player (different from last night). If executed tomorrow, they don't die.

  - name: Dreamer
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, choose a player (Not yourself or Travellers). You learn one good and one evil character, 1 of which is correct.

  - name: Drunk
    alignment: Outsider
    set: Trouble Brewing
    description: Thinks they are a Townsfolk but their ability does not work.

  - name: Empath
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night, learns how many of their two alive neighbours are evil.

  - name: Engineer
    alignment: Townsfolk
    set: Experimental Characters
    description: Once per game, at night, choose which Minions or which Demon is in play.

  - name: Evil Twin
    alignment: Minion
    set: Sects & Violets
    description: You & an opposing player know each other. If the good player is executed, evil wins. Good can't win if you both live.

  - name: Exorcist
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, choose a player (Different to last night), the demon, if chosen, learns who you are then doesn't wake tonight.

  - name: Fang Gu
    alignment: Demon
    set: Sects & Violets
    description: Kills every night, the first outsider to be killed by the Fan Gu becomes them and they die!

  - name: Farmer
    alignment: Townsfolk
    set: Experimental Characters
    description: When you die at night, an alive good player becomes a Farmer.

  - name: Fearmonger
    alignment: Minion
    set: Experimental Characters
    description: Each night, choose a player. If they nominate & execute them, their team loses. All players know if you choose a new player.

  - name: Fisherman
    alignment: Townsfolk
    set: Experimental Characters
    description: Once per game, during the day, visit the Storyteller for some advice to help your team win.

  - name: Flowergirl
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, you learn if a Demon voted today.

  - name: Fool
    alignment: Townsfolk
    set: Bad Moon Rising
    description: The first time you die, you don't.

  - name: Fortune Teller
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night, pick two players. Learns if either is the Demon, but one might register as the Demon falsely.

  - name: Gambler
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, choose a player and guess their character. if you guess wrong you die.

  - name: General
    alignment: Townsfolk
    set: Experimental Characters
    description: Each Night, you learn which alignment the Storyteller believes is winning, wither good, evil or neither.

  - name: Goblin
    alignment: Minion
    set: Experimental Characters
    description: If you publicly claim to be the Goblin when nominated & are executed that day, your team wins.

  - name: Godfather
    alignment: Minion
    set: Bad Moon Rising
    description: You start knowing which outsiders are in play. If 1 Died today, choose a player tonight, they die. You add or subtract one minion.

  - name: Golem
    alignment: Outsider
    set: Experimental Characters
    description: You may nominate once per game. When you do, if they nominee is not the Demon, they die.

  - name: Goon
    alignment: Outsider
    set: Bad Moon Rising
    description: Each night, the 1st player to choose you with their ability is drunk until Dusk. You become their alignment.

  - name: Gossip
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each day, you may make a public statement. Tonight if it was true, a player dies.

  - name: Grandmother
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Starts Knowing the Role of one good player. If the demon kills their Grandchild they die too.

  - name: Harpy
    alignment: Minion
    set: Experimental Characters
    description: Pick two players, the first must pretend that the second is evil or one or both may die.

  - name: Hatter
    alignment: Outsider
    set: Experimental Characters
    description: If you died today or tonight, the Minion & Demon players may choose new Minion & Demon characters to be.

  - name: Heretic
    alignment: Outsider
    set: Experimental Characters
    description: Whoever wins, loses & whoever loses, wins, even if you are dead.

  - name: Hermit
    alignment: Outsider
    set: Experimental Characters
    description: You have all Outsider abilities(Can reduce outsides by 0 or 1).

  - name: Huntsman
    alignment: Townsfolk
    set: Experimental Characters
    description: Once per game guess who the Damsel is. If you are correct the Damsel becomes a Townsfolk.

  - name: Imp
    alignment: Demon
    set: Trouble Brewing
    description: Kills a player each night. Can kill themselves to pass the Imp to a Minion.

  - name: Innkeeper
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, choose 2 players, they can't die tonight, but 1 is drunk until dusk.

  - name: Investigator
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing one of two players is a particular Minion.

  - name: Juggler
    alignment: Townsfolk
    set: Sects & Violets
    description: On your 1st day, publically guess up to 5 player's characters. That night you learn how many you got correct.

  - name: Kazali
    alignment: Demon
    set: Experimental Characters
    description: Each Night, choose a player, they die. You choose which players are which Minions. - ? to +? Outsiders.

  - name: Klutz
    alignment: Outsider
    set: Sects & Violets
    description: When you learn that you died, publicaly choose 1 alive player, if they are evil your team loses.

  - name: Legion
    alignment: Demon
    set: Experimental Characters
    description: Each night a player might die. Executions fail if only evil voted. You register as a Minion too. (Most players are Legion)

  - name: Leviathan
    alignment: Demon
    set: Experimental Characters
    description: If more than 1 good playeris executed, evil wins. All players know you are in play. After day 5, evil wins.

  - name: Librarian
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing 1 of 2 players is a particular Outsider

  - name: Lil' Monsta
    alignment: Demon
    set: Experimental Characters
    description: Each night, Minions choose who babysit Lil' Monsta & is the demon. Each night a player might die (+1 Minion).

  - name: Lleech
    alignment: Demon
    set: Experimental Characters
    description: Each night, choose a player, they die. You start by choosing a player that becomes poisoned. You die if and only if they are dead.

  - name: Lord of Typhon
    alignment: Demon
    set: Experimental Characters
    description: Each night, choose a player, they die. Evil characters are in a line with you being in the middle. (+1 Minion) -? to +? Outsiders.

  - name: Lunatic
    alignment: Outsider
    set: Bad Moon Rising
    description: Think they are the Demon but they are actually in fact Good

  - name: Lycanthrope
    alignment: Townsfolk
    set: Experimental Characters
    description: Attacks Every night and if Good they die, but they are the only character that dies today

  - name: Marionette
    alignment: Minion
    set: Experimental Characters
    description: Thinks they are a good character but is actually evil

  - name: Mastermind
    alignment: Minion
    set: Bad Moon Rising
    description: If the demon dies by execution, play for 1 more day. If a player is then executed their team loses.

  - name: Mathematician
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, you learn how many player's abilities worked abnormally(Since Dawn) due to another characters ability.

  - name: Mayor
    alignment: Townsfolk
    set: Trouble Brewing
    description: If only 3 players are alive and no execution occurs, Good wins. If you die at night, another player might die instead.

  - name: Mezepheles
    alignment: Minion
    set: Experimental Characters
    description: You start knowing a secret word. The 1st good player to say this word becomes evil that night.

  - name: Minstrel
    alignment: Townsfolk
    set: Bad Moon Rising
    description: When a minion dies by execution, all other players (Except Travellers) are drunk until Dusk tomorrow.

  - name: Monk
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night (except the first), pick a player (not yourself). The Demon cannot kill them tonight.

  - name: Moonchild
    alignment: Outsider
    set: Bad Moon Rising
    description: When you learn that you died, publicly choose 1 alive player. Tonight, if it was a good player they die.

  - name: Mutant
    alignment: Outsider
    set: Sects & Violets
    description: If you are mad about being an OUtsider, you might be executed.

  - name: Nightwatchman
    alignment: Townsfolk
    set: Experimental Characters
    description: Once per game, at night, choose a player. They learn you are the Nightwatchman.

  - name: No Dashii
    alignment: Demon
    set: Sects & Violets
    description: Each night, choose a player, they die. Your 2 Townsfolk neighbors are poisoned.

  - name: Noble
    alignment: Townsfolk
    set: Experimental Characters
    description: Starts knowing three players. 1 and only 1 is Evil.

  - name: Ogre
    alignment: Outsider
    set: Experimental Characters
    description: On your 1st night, choose a player (Not yourself), you become their alignment even if drunk or poisoned.

  - name: Ojo
    alignment: Demon
    set: Experimental Characters
    description: Each night, choose a character. They die, if they are not in play the Storyteller chooses who dies.

  - name: Oracle
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night learns how many dead players are evil.

  - name: Organ Grinder
    alignment: Minion
    set: Experimental Characters
    description: All players keep their eyes closed when voting and the vote tally is secret. each night choose if you are drunk until Dusk.

  - name: Pacifist
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Executed good players might not die.

  - name: Philosopher
    alignment: Townsfolk
    set: Sects & Violets
    description: Once per game, at night, choose a good character. gain that ability. If this character is in play they are drunk.

  - name: Pit-Hag
    alignment: Minion
    set: Sects & Violets
    description: Each night, choose a player & a character they become (If not in play). If a Demon is made, deaths tonight are arbitrary.

  - name: Pixie
    alignment: Townsfolk
    set: Experimental Characters
    description: Starts knowing 1 Townsfolk, if they pretend to be that character they get the ability when the original dies.

  - name: Plague Doctor
    alignment: Outsider
    set: Experimental Characters
    description: When you die, the Storyteller gains a Minion ability.

  - name: Po
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, you may choose a player, they die. If your last choice was no-one, choose 3 players tonight.

  - name: Poisoner
    alignment: Minion
    set: Trouble Brewing
    description: Each night, pick a player. Their ability is poisoned until dusk the next night.

  - name: Politician
    alignment: Outsider
    set: Experimental Characters
    description: If you were the player most responsible for your team losing, you change alignment & win, even if dead.

  - name: Poppy Grower
    alignment: Townsfolk
    set: Experimental Characters
    description: Minons & Demons do not know each other. If you die, they learn who each other are that night.

  - name: Preacher
    alignment: Townsfolk
    set: Experimental Characters
    description: Each night, choose a player. A Minion, if chosen, learns this. All chosen Minions have no ability.

  - name: Princess
    alignment: Townsfolk
    set: Experimental Characters
    description: On your 1st day, if you nominated and executed a player, the demon doesn't kill tonight.

  - name: Professor
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Once per game, at night. choose a dead player. If they are townsfold, they are resurted.

  - name: Psychopath
    alignment: Minion
    set: Experimental Characters
    description: Each day, before nominations, you may publicly chose a player, they die. If executed you only die if you lose Rock paper scissors.

  - name: Pukka
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, choose a player, they are poisoned. The previously poisoned player dies then becomes healthy.

  - name: Puzzlemaster
    alignment: Outsider
    set: Experimental Characters
    description: 1 play is drunk, even if you die. If you guess(once) who it is, learn the Demon player, but guess wrong & get false info.

  - name: Ravenkeeper
    alignment: Townsfolk
    set: Trouble Brewing
    description: If you die at night, you may choose a player and learn their role.

  - name: Recluse
    alignment: Outsider
    set: Trouble Brewing
    description: Might register as evil or as a Minion or Demon, even if dead.

  - name: Riot
    alignment: Demon
    set: Experimental Characters
    description: On day 3, Minions become Riot & nominees die but nominate an alive player immediately. This must happen.

  - name: Sage
    alignment: Townsfolk
    set: Sects & Violets
    description: If the Demon kills you, you learn that it is 1 or 2 players.

  - name: Sailor
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night pick an alive player, either you or they are drunk until dusk. You can't die.

  - name: Saint
    alignment: Outsider
    set: Trouble Brewing
    description: If you are executed, your team loses.

  - name: Savant
    alignment: Townsfolk
    set: Sects & Violets
    description: Each day, you may visit the storyteller to learn 2 things in private. 1 is true and 1 is false.

  - name: Scarlet Woman
    alignment: Minion
    set: Trouble Brewing
    description: If there are 5 or more players alive and the Demon dies, you become the Demon.

  - name: Seamstress
    alignment: Townsfolk
    set: Sects & Violets
    description: Once per Game can learn if two players are on the same team.

  - name: Shabaloth
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, choose 2 players, they die. A dead player you choose last night might be regurgitated.

  - name: Shugenja
    alignment: Townsfolk
    set: Experimental Characters
    description: You start knowing if your closest evil playeris clockwise or anti-clockwise.

  - name: Slayer
    alignment: Townsfolk
    set: Trouble Brewing
    description: Once per game, during the day, publicly choose a player. If they are the Demon, they die.

  - name: Snake Charmer
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, choose an alive player, A chosen Demon swaps characters & alignments with you & is then poisoned.

  - name: Snitch
    alignment: Outsider
    set: Experimental Characters
    description: Each Minion gets 3 bluffs.

  - name: Soldier
    alignment: Townsfolk
    set: Trouble Brewing
    description: Cannot be killed by the Demon.

  - name: Spy
    alignment: Minion
    set: Trouble Brewing
    description: Sees the Grimoire each night. May register as good or as a Townsfolk or Outsider.

  - name: Steward
    alignment: Townsfolk
    set: Experimental Characters
    description: You start knowing 1 good player.

  - name: Summoner
    alignment: Minion
    set: Experimental Characters
    description: You get 3 bluffs. On the 3rd night, choose a player, they become an evil Demon of your choice (No Demon).

  - name: Sweetheart
    alignment: Outsider
    set: Sects & Violets
    description: When you die, 1 player is drunk from now on.

  - name: Tea Lady
    alignment: Townsfolk
    set: Bad Moon Rising
    description: If both your alive neighbours are good, they can't die.

  - name: Tinker
    alignment: Outsider
    set: Bad Moon Rising
    description: You might die at any time.

  - name: Town Crier
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, you learn if a Minion nominated today.

  - name: Undertaker
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night (except the first), learns which role the player executed today was.

  - name: Vigormortis
    alignment: Demon
    set: Sects & Violets
    description: Each night, choose a player they die. Minions you kill keep their ability & poison 1 Townsfolk neighbour. 1 less Outsider.

  - name: Village Idiot
    alignment: Townsfolk
    set: Experimental Characters
    description: Each night choose a player, you learn their alignment. There can be up to 3 Village idiots in the town. If their are more, 1  is drunk.

  - name: Virgin
    alignment: Townsfolk
    set: Trouble Brewing
    description: The first time you are nominated, if the nominator is a Townsfolk, they are immediately executed.

  - name: Vizier
    alignment: Minion
    set: Experimental Characters
    description: All players know you are the Vizier, you cannot die during the day. If good voted, you may choose to execute immediately.

  - name: Vortox
    alignment: Demon
    set: Sects & Violets
    description: Each night, choose a player, they die. Townsfolk abilities yield false info. Each day if no-one is executed, evil wins.

  - name: Washerwoman
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing one of two players is a particular Townsfolk.

  - name: Widow
    alignment: Minion
    set: Experimental Characters
    description: On your 1st Night, look at the Grimoire & choose a player. They are poisoned. 1 good player knows the widow is in play.

  - name: Witch
    alignment: Minion
    set: Sects & Violets
    description: Each night, choose a player. If they nominate tomorrow, they die. If just 3 players live, you lose this ability.

  - name: Wizard
    alignment: Minion
    set: Experimental Characters
    description: Once per game, choose to make a wish. If granted it might have a price and leave a clue to its nature.

  - name: Wraith
    alignment: Minion
    set: Experimental Characters
    description: You may choose to open your eyes at night. You wake when other evil players do.

  - name: Xaan
    alignment: Minion
    set: Experimental Characters
    description: On Night X, all Townsfolk are poisoned until Dusk (X Outsiders).

  - name: Yaggababble
    alignment: Demon
    set: Experimental Characters
    description: You start knowing a secret phrase. For each time you said it publicly today, a player might die.

  - name: Zealot
    alignment: Outsider
    set: Experimental Characters
    description: If there are 5 or more players alive, you must vote for every nomination.

  - name: Zombuul
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, if no-one died today, choose a player, they die. The 1st time you die, you live but register as dead.
