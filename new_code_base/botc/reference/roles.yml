roles:
  - name: Butler
    alignment: Outsider
    set: Trouble Brewing
    description: Each night, pick a player. Tomorrow, you may only vote if they do.

  - name: Cannibal
    alignment: Townsfolk
    set: Experimental Characters
    description: Gains the ability of the person that was most recently executed if they where good.

  - name: Cerenovus
    alignment: Minion
    set: Sects & Violets
    description: Each night pick a player and force them to pretend to be another character

  - name: Chef
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing how many pairs of evil players sit adjacent to each other.

  - name: Drunk
    alignment: Outsider
    set: Trouble Brewing
    description: Thinks they are a Townsfolk but their ability does not work.

  - name: Empath
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night, learns how many of their two alive neighbours are evil.

  - name: Fang Gu
    alignment: Demon
    set: Sects & Violets
    description: Kills every night, the first outsider to be killed by the Fan Gu becomes them and they die!

  - name: Fortune Teller
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night, pick two players. Learns if either is the Demon, but one might register as the Demon falsely.

  - name: Grandmother
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Starts Knowing the Role of one good player. If the demon kills their Grandchild they die too.

  - name: Harpy
    alignment: Minion
    set: Experimental Characters
    description: Pick two players, the first must pretend that the second is evil or one or both may die.

  - name: Imp
    alignment: Demon
    set: Trouble Brewing
    description: Kills a player each night. Can kill themselves to pass the Imp to a Minion.

  - name: Investigator
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing one of two players is a particular Minion.

  - name: Librarian
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing 1 of 2 players is a particular Outsider

  - name: Lunatic
    alignment: Outsider
    set: Bad Moon Rising
    description: Think they are the Demon but they are actually in fact Good

  - name: Lycanthrope
    alignment: Townsfolk
    set: Experimental Characters
    description: Attacks Every night and if Good they die, but they are the only character that dies today

  - name: Marionette
    alignment: Minion
    set: Experimental Characters
    description: Thinks they are a good character but is actually evil

  - name: Mayor
    alignment: Townsfolk
    set: Trouble Brewing
    description: If only 3 players are alive and no execution occurs, Good wins. If you die at night, another player might die instead.

  - name: Monk
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night (except the first), pick a player (not yourself). The Demon cannot kill them tonight.

  - name: Noble
    alignment: Townsfolk
    set: Experimental Characters
    description: Starts knowing three players. 1 and only 1 is Evil.

  - name: Oracle
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night learns how many dead players are evil.

  - name: Pixie
    alignment: Townsfolk
    set: Experimental Characters
    description: Starts knowing 1 Townsfolk, if they pretend to be that character they get the ability when the original dies.

  - name: Poisoner
    alignment: Minion
    set: Trouble Brewing
    description: Each night, pick a player. Their ability is poisoned until dusk the next night.

  - name: Ravenkeeper
    alignment: Townsfolk
    set: Trouble Brewing
    description: If you die at night, you may choose a player and learn their role.

  - name: Recluse
    alignment: Outsider
    set: Trouble Brewing
    description: Might register as evil or as a Minion or Demon, even if dead.

  - name: Saint
    alignment: Outsider
    set: Trouble Brewing
    description: If you are executed, your team loses.

  - name: Scarlet Woman
    alignment: Minion
    set: Trouble Brewing
    description: If there are 5 or more players alive and the Demon dies, you become the Demon.

  - name: Seamstress
    alignment: Townsfolk
    set: Sects & Violets
    description: Once per Game can learn if two players are on the same team.

  - name: Slayer
    alignment: Townsfolk
    set: Trouble Brewing
    description: Once per game, during the day, publicly choose a player. If they are the Demon, they die.

  - name: Soldier
    alignment: Townsfolk
    set: Trouble Brewing
    description: Cannot be killed by the Demon.

  - name: Spy
    alignment: Minion
    set: Trouble Brewing
    description: Sees the Grimoire each night. May register as good or as a Townsfolk or Outsider.

  - name: Undertaker
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night (except the first), learns which role the player executed today was.

  - name: Virgin
    alignment: Townsfolk
    set: Trouble Brewing
    description: The first time you are nominated, if the nominator is a Townsfolk, they are immediately executed.

  - name: Washerwoman
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing one of two players is a particular Townsfolk.

  - name: Baron
    alignment: Minion
    set: Trouble Brewing
    description: They add 2 Outisiders to the game.

  - name: Sailor
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night pick an alive player, either you or they are drunk until dusk. You can't die.

  - name: Chambermaid
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, Choose 2 alive players (Not yourself). You learn how many work tonight due to their ability.

  - name: Exorcist
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, choose a player (Different to last night), the demon, if chosen, learns who you are then doesn't wake tonight.

  - name: Innkeeper
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, choose 2 players, they can't die tonight, but 1 is drunk until dusk.

  - name: Gambler
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each night, choose a player and guess their character. if you guess wrong you die.

  - name: Gossip
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Each day, you may make a public statement. Tonight if it was true, a player dies.

  - name: Cortier
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Once per game, at night, choose a character. They are drunk for 3 nights & 3 days.

  - name: Professor
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Once per game, at night. choose a dead player. If they are townsfold, they are resurrected.

  - name: Minstrel
    alignment: Townsfolk
    set: Bad Moon Rising
    description: When a minion dies by execution, all other players (Except Travellers) are drunk until Dusk tomorrow.

  - name: Tea Lady
    alignment: Townsfolk
    set: Bad Moon Rising
    description: If both your alive neighbours are good, they can't die.

  - name: Pacifist
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Executed good players might not die.

  - name: Fool
    alignment: Townsfolk
    set: Bad Moon Rising
    description: The first time you die, you don't.

  - name: Goon
    alignment: Outsider
    set: Bad Moon Rising
    description: Each night, the 1st player to choose you with their ability is drunk until Dusk. You become their alignment.

  - name: Tinker
    alignment: Outsider
    set: Bad Moon Rising
    description: You might die at any time.

  - name: Moonchild
    alignment: Outsider
    set: Bad Moon Rising
    description: When you learn that you died, publicly choose 1 alive player. Tonight, if it was a good player they die.

  - name: Godfather
    alignment: Minion
    set: Bad Moon Rising
    description: You start knowing which outsiders are in play. If 1 Died today, choose a player tonight, they die. You add or subtract one minion.

  - name: Devil's Advocate
    alignment: Minion
    set: Bad Moon Rising
    description: Each night, choose a living player (different from last night). If executed tomorrow, they don't die.

  - name: Assassin
    alignment: Minion
    set: Bad Moon Rising
    description: Once per game, at night, choose a player. They die, even if for some reason they could not.

  - name: Mastermind
    alignment: Minion
    set: Bad Moon Rising
    description: If the demon dies by execution, play for 1 more day. If a player is then executed their team loses.

  - name: Zombuul
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, if no-one died today, choose a player, they die. The 1st time you die, you live but register as dead.

  - name: Pukka
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, choose a player, they are poisoned. The previously poisoned player dies then becomes healthy.

  - name: Shabaloth
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, choose 2 players, they die. A dead player you choose last night might be regurgitated.

  - name: Po
    alignment: Demon
    set: Bad Moon Rising
    description: Each night, you may choose a player, they die. If your last choice was no-one, choose 3 players tonight.

  - name: Clockmaker
    alignment: Townsfolk
    set: Sects & Violets
    description: You start knowing how many steps from the Demon to its nearest Minion.

  - name: Dreamer
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, choose a player (Not yourself or Travellers). You learn one good and one evil character, 1 of which is correct.

  - name: Snake Charmer
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, choose an alive player, A chosen Demon swaps characters & alignments with you & is then poisoned.

  - name: Mathematician
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, you learn how many player's abilities worked abnormally(Since Dawn) due to another characters ability.

  - name: Flowergirl
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, you learn if a Demon voted today.

  - name: Town Crier
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night, you learn if a Minion nominated today.

  - name: Savant
    alignment: Townsfolk
    set: Sects & Violets
    description: Each day, you may visit the storyteller to learn 2 things in private. 1 is true and 1 is false.

  - name: Philosopher
    alignment: Townsfolk
    set: Sects & Violets
    description: Once per game, at night, choose a good character. gain that ability. If this character is in play they are drunk.

  - name: Artist
    alignment: Townsfolk
    set: Sects & Violets
    description: Once per game, during the day, privately ask the story any yes/no question.

  - name: Juggler
    alignment: Townsfolk
    set: Sects & Violets
    description: On your 1st day, publically guess up to 5 player's characters. That night you learn how many you got correct.

  - name: Sage
    alignment: Townsfolk
    set: Sects & Violets
    description: If the Demon kills you, you learn that it is 1 or 2 players.

  - name: Mutant
    alignment: Outsider
    set: Sects & Violets
    description: If you are mad about being an OUtsider, you might be executed.

  - name: Sweetheart
    alignment: Outsider
    set: Sects & Violets
    description: When you die, 1 player is drunk from now on.

  - name: Barber
    alignment: Outsider
    set: Sects & Violets
    description: If you died today or tonight, the demon may choose 2 players(Not another Demon) to swap characters.

  - name: Klutz
    alignment: Outsider
    set: Sects & Violets
    description: When you learn that you died, publicaly choose 1 alive player, if they are evil your team loses.

  - name: Evil Twin
    alignment: Minion
    set: Sects & Violets
    description: You & an opposing player know each other. If the good player is executed, evil wins. Good can't win if you both live.

  - name: Witch
    alignment: Minion
    set: Sects & Violets
    description: Each night, choose a player. If they nominate tomorrow, they die. If just 3 players live, you lose this ability.

  - name: Pit-Hag
    alignment: Minion
    set: Sects & Violets
    description: Each night, choose a player & a character they become (If not in play). If a Demon is made, deaths tonight are arbitrary.

  - name: Vigormortis
    alignment: Demon
    set: Sects & Violets
    description: Each night, choose a player they die. Minions you kill keep their ability & poison 1 Townsfolk neighbour. 1 less Outsider.

  - name: No Dashii
    alignment: Demon
    set: Sects & Violets
    description: Each night, choose a player, they die. Your 2 Townsfolk neighbors are poisoned.

  - name: Vortox
    alignment: Demon
    set: Sects & Violets
    description: Each night, choose a player, they die. Townsfolk abilities yield false info. Each day if no-one is executed, evil wins.
