roles:
  - name: Butler
    alignment: Outsider
    set: Trouble Brewing
    description: Each night, pick a player. Tomorrow, you may only vote if they do.

  - name: Cannibal
    alignment: Townsfolk
    set: Experimental Characters
    description: Gains the ability of the person that was most recently executed if they where good.

  - name: Cerenovus
    alignment: Minion
    set: Sects & Violets
    description: Each night pick a player and force them to pretend to be another character

  - name: Chef
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing how many pairs of evil players sit adjacent to each other.

  - name: Drunk
    alignment: Outsider
    set: Trouble Brewing
    description: Thinks they are a Townsfolk but their ability does not work.

  - name: Empath
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night, learns how many of their two alive neighbours are evil.

  - name: Fang Gu
    alignment: Demon
    set: Sects & Violets
    description: Kills every night, the first outsider to be killed by the Fan Gu becomes them and they die!

  - name: Fortune Teller
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night, pick two players. Learns if either is the Demon, but one might register as the Demon falsely.

  - name: Grandmother
    alignment: Townsfolk
    set: Bad Moon Rising
    description: Starts Knowing the Role of one good player. If the demon kills their Grandchild they die too.

  - name: Harpy
    alignment: Minion
    set: Experimental Characters
    description: Pick two players, the first must pretend that the second is evil or one or both may die.

  - name: Imp
    alignment: Demon
    set: Trouble Brewing
    description: Kills a player each night. Can kill themselves to pass the Imp to a Minion.

  - name: Investigator
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing one of two players is a particular Minion.

  - name: Librarian
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing 1 of 2 players is a particular Outsider

  - name: Lunatic
    alignment: Outsider
    set: Bad Moon Rising
    description: Think they are the Demon but they are actually in fact Good

  - name: Lycanthrope
    alignment: Townsfolk
    set: Experimental Characters
    description: Attacks Every night and if Good they die, but they are the only character that dies today

  - name: Marionette
    alignment: Minion
    set: Experimental Characters
    description: Thinks they are a good character but is actually evil

  - name: Mayor
    alignment: Townsfolk
    set: Trouble Brewing
    description: If only 3 players are alive and no execution occurs, Good wins. If you die at night, another player might die instead.

  - name: Monk
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night (except the first), pick a player (not yourself). The Demon cannot kill them tonight.

  - name: Noble
    alignment: Townsfolk
    set: Experimental Characters
    description: Starts knowing three players. 1 and only 1 is Evil.

  - name: Oracle
    alignment: Townsfolk
    set: Sects & Violets
    description: Each night learns how many dead players are evil.

  - name: Pixie
    alignment: Townsfolk
    set: Experimental Characters
    description: Starts knowing 1 Townsfolk, if they pretend to be that character they get the ability when the original dies.

  - name: Poisoner
    alignment: Minion
    set: Trouble Brewing
    description: Each night, pick a player. Their ability is poisoned until dusk the next night.

  - name: Ravenkeeper
    alignment: Townsfolk
    set: Trouble Brewing
    description: If you die at night, you may choose a player and learn their role.

  - name: Recluse
    alignment: Outsider
    set: Trouble Brewing
    description: Might register as evil or as a Minion or Demon, even if dead.

  - name: Saint
    alignment: Outsider
    set: Trouble Brewing
    description: If you are executed, your team loses.

  - name: Scarlet Woman
    alignment: Minion
    set: Trouble Brewing
    description: If there are 5 or more players alive and the Demon dies, you become the Demon.

  - name: Seamstress
    alignment: Townsfolk
    set: Sects & Violets
    description: Once per Game can learn if two players are on the same team.

  - name: Slayer
    alignment: Townsfolk
    set: Trouble Brewing
    description: Once per game, during the day, publicly choose a player. If they are the Demon, they die.

  - name: Soldier
    alignment: Townsfolk
    set: Trouble Brewing
    description: Cannot be killed by the Demon.

  - name: Spy
    alignment: Minion
    set: Trouble Brewing
    description: Sees the Grimoire each night. May register as good or as a Townsfolk or Outsider.

  - name: Undertaker
    alignment: Townsfolk
    set: Trouble Brewing
    description: Each night (except the first), learns which role the player executed today was.

  - name: Virgin
    alignment: Townsfolk
    set: Trouble Brewing
    description: The first time you are nominated, if the nominator is a Townsfolk, they are immediately executed.

  - name: Washerwoman
    alignment: Townsfolk
    set: Trouble Brewing
    description: Starts knowing one of two players is a particular Townsfolk.
