requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "black>=24.0",
    "delta-spark>=3.2",
    "duckdb>=0.10",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "pyspark>=3.5",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "tqdm>=4.66",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-databricks>=1.8",
]
